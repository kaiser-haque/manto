name: Release to Maven Central

# Safe release workflow for Maven Central via Sonatype Central Portal.
#
# Design goals (see docs/MAVEN_CENTRAL.md and docs/RELEASE_STRATEGY.md):
#  - Credentials never committed: all secrets come from GitHub Actions secrets.
#  - No accidental publish: `autoPublish=false` so `mvn deploy` only uploads +
#    validates; a human must click "Publish" on https://central.sonatype.com
#    under Publishing > Deployments. Even a tag push cannot auto-release.
#  - 1.0.0 is NOT published by this workflow until manually triggered for that
#    version. Today (Day 28) the workflow is dry-run/validation only.
#  - Reproducible + tested: the workflow runs `clean verify` with the `release`
#    profile (sources, javadoc, GPG signatures) before any upload.
#  - Checksums are generated by central-publishing-maven-plugin (all).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#  CENTRAL_USERNAME  - Sonatype Central Portal token username
#  CENTRAL_TOKEN     - Sonatype Central Portal token password
#  GPG_PRIVATE_KEY   - ASCII-armored private key (`gpg --export-secret-keys --armor <keyId>`)
#  GPG_PASSPHRASE    - Passphrase for the GPG private key
#
# The public key MUST be published to a supported keyserver before release:
#  gpg --keyserver keyserver.ubuntu.com --send-keys <keyId>
#  (also keys.openpgp.org and pgp.mit.edu are accepted)
#
# See https://central.sonatype.org/publish/publish-portal-maven/
# and https://central.sonatype.org/publish/requirements/

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.9.0). Leave empty to use pom version.'
        required: false
        type: string
      dryRun:
        description: 'Dry run — validate bundle (sources, javadoc, signatures) without uploading to Central Portal'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Tag detected: $TAG"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "::error::Tag $TAG does not match vX.Y.Z pattern"
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Release version from tag: $VERSION"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Release version from input: ${{ inputs.version }}"
          else
            POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
            echo "Release version from pom: $POM_VERSION"
          fi

      - name: Guard against accidental 1.0.0 publish (Day 28 — do not publish 1.0.0 today)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          echo "Resolved version: $VERSION"
          if [[ "$VERSION" == "1.0.0" ]]; then
            echo "::error::1.0.0 release is not allowed today. Use 0.9.0 RC or a dry-run. See docs/MAVEN_CENTRAL.md."
            exit 1
          fi
          # SNAPSHOT is only forbidden for real publishes; dryRun validates bundle from SNAPSHOT pom
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.dryRun }}" != "true" ]]; then
            if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
              echo "::error::Release version must not end with -SNAPSHOT: $VERSION (use a release version like 0.9.0, or run with dryRun:true to validate SNAPSHOT)"
              exit 1
            fi
          else
            echo "::notice::dryRun with SNAPSHOT $VERSION — allowed for bundle validation (no Central upload)"
          fi

      - name: Verify tag matches pom (when tag push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Tag version: $TAG_VERSION  Pom version: $POM_VERSION"
          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "::warning::Pom version $POM_VERSION does not match tag $TAG_VERSION. Ensure pom was updated before tagging (mvn versions:set -DnewVersion=$TAG_VERSION)."
          fi

      - name: Build, test, and generate release artifacts (sources, javadoc, signatures)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B clean verify -P release -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Verify bundle contents (per Maven Central requirements)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Required artifacts per module (main jar, sources, javadoc, .asc signatures) ==="
          for module in manto-core manto-kafka manto-spring-boot-autoconfigure manto-spring-boot-starter manto-test; do
            echo "--- $module ---"
            ls -1 "$module/target/"*.jar 2>/dev/null || echo "  (no jars found)"
            echo "  Checking for sources jar..."
            ls -1 "$module/target/"*"-sources.jar" 2>/dev/null || echo "  MISSING: sources jar"
            echo "  Checking for javadoc jar..."
            ls -1 "$module/target/"*"-javadoc.jar" 2>/dev/null || echo "  MISSING: javadoc jar"
            echo "  Checking for .asc signatures..."
            ls -1 "$module/target/"*.asc 2>/dev/null || echo "  MISSING: .asc (signatures — requires GPG key)"
          done
          echo ""
          echo "Note: .asc files are only present when a real GPG key is configured."
          echo "Local dry-run without key uses -Dgpg.skip=true and skips signature check:"
          echo "  mvn -B clean verify -P release -Dgpg.skip=true"

      - name: Upload to Central Portal (validated only — manual publish required)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dryRun == false)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "Uploading bundle to Central Portal (autoPublish=false, waitUntil=validated)..."
          echo "After this job, visit https://central.sonatype.com/publishing/deployments to review and click Publish."
          mvn -B deploy -P release -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"

      - name: Dry-run summary (no upload)
        if: github.event_name == 'workflow_dispatch' && inputs.dryRun == true
        run: |
          echo "Dry run complete — no upload performed."
          echo "To publish for real, re-run workflow with dryRun=false or push a tag vX.Y.Z."
          echo "Upload step uses: mvn -B deploy -P release -DskipTests"
          echo "It uploads to https://central.sonatype.com with autoPublish=false."
          echo "You must then manually publish the validated deployment in the Portal UI."
