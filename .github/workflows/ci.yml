name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify build (no release artifacts)
        run: mvn -B clean verify

      - name: Verify sources/javadoc can be generated (release profile dry-run, no signing)
        run: mvn -B verify -P release -Dgpg.skip=true -DskipTests
